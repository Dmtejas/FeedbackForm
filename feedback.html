<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Feedback Form</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="container">
    <h1>📋 Teacher Feedback Form</h1>
    <form id="feedbackForm">
      <div class="form-group">
        <label for="teacher">Teacher Name</label>
        <input type="text" id="teacher" name="teacher" placeholder="e.g. Mr. Sharma" required />
      </div>

      <div class="form-group">
        <label for="rating">Rating</label>
        <div class="rating">
          <input type="radio" name="rating" id="rate-5" value="5" required />
          <label for="rate-5">★</label>
          <input type="radio" name="rating" id="rate-4" value="4" />
          <label for="rate-4">★</label>
          <input type="radio" name="rating" id="rate-3" value="3" />
          <label for="rate-3">★</label>
          <input type="radio" name="rating" id="rate-2" value="2" />
          <label for="rate-2">★</label>
          <input type="radio" name="rating" id="rate-1" value="1" />
          <label for="rate-1">★</label>
        </div>
      </div>

      <div class="form-group">
        <label for="comments">Comments (Optional)</label>
        <textarea id="comments" name="comments" placeholder="Share your thoughts..."></textarea>
      </div>

      <button type="submit">Submit Feedback</button>
    </form>
    <div id="success-message" class="hidden">✅ Thank you for your feedback!</div>
  </div>

  <script>
    const form = document.getElementById("feedbackForm");
    const message = document.getElementById("success-message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        teacher: form.teacher.value,
        rating: form.rating.value,
        comments: form.comments.value
      };

      const res = await fetch("/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        form.reset();
        message.classList.remove("hidden");
        message.classList.add("fade-in");
        setTimeout(() => message.classList.add("hidden"), 4000);
      }
    });
  </script>
</body>
</html>
